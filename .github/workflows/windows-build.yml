name: Windows April 2026 Builds

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  # FIX: Tell ezvcpkg exactly where to look so it finds our patched version
  EZVCPKG_BASE_DIR: ${{ github.workspace }}/.ezvcpkg

jobs:
  double:
    name: Build Godot3DTiles Extension (Double Precision)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: 'latest'

    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Install SCons
      run: pip install scons

    - name: Setup MSVC 2022
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: '17.7'
        include-optional: true

    # FIX: Pre-fetch vcpkg and patch the dead MSYS2 mirrors to the archive server
    - name: Pre-fetch and patch vcpkg MSYS2 mirrors
      run: |
        $VcpkgCommit = "dbe35ceb30c688bf72e952ab23778e009a578f18"
        $VcpkgDir = "${{ github.workspace }}/.ezvcpkg/$VcpkgCommit"
        
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/.ezvcpkg"
        git clone https://github.com/microsoft/vcpkg.git $VcpkgDir
        
        Push-Location $VcpkgDir
        git checkout $VcpkgCommit
        
        $ScriptPath = "scripts/cmake/vcpkg_acquire_msys.cmake"
        (Get-Content $ScriptPath) -replace 'mirror\.msys2\.org', 'archive.msys2.org' -replace 'repo\.msys2\.org', 'archive.msys2.org' | Set-Content $ScriptPath
        
        Pop-Location

    - name: Build Extension (Double Precision Debug)
      run: scons platform=windows arch=x64 compileTarget=extension target=template_release buildCesium=true precision=double

    - name: Verify Build Output
      run: if ((gci godot3dtiles/addons/cesium_godot/lib -Filter "*.dll").Count -lt 1) { exit 1 }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: godot3dtiles-double-precision-dev
        path: godot3dtiles/

  single:
    name: Build Godot3DTiles Extension (Single Precision)
    runs-on: windows-latest
    needs: double

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: 'latest'

    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Install SCons
      run: pip install scons

    - name: Setup MSVC 2022
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: '17.7'
        include-optional: true

    # FIX: Apply the exact same patch for the single precision job
    - name: Pre-fetch and patch vcpkg MSYS2 mirrors
      run: |
        $VcpkgCommit = "dbe35ceb30c688bf72e952ab23778e009a578f18"
        $VcpkgDir = "${{ github.workspace }}/.ezvcpkg/$VcpkgCommit"
        
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/.ezvcpkg"
        git clone https://github.com/microsoft/vcpkg.git $VcpkgDir
        
        Push-Location $VcpkgDir
        git checkout $VcpkgCommit
        
        $ScriptPath = "scripts/cmake/vcpkg_acquire_msys.cmake"
        (Get-Content $ScriptPath) -replace 'mirror\.msys2\.org', 'archive.msys2.org' -replace 'repo\.msys2\.org', 'archive.msys2.org' | Set-Content $ScriptPath
        
        Pop-Location

    - name: Build Extension (Single Precision Debug)
      run: scons platform=windows arch=x64 compileTarget=extension target=template_release buildCesium=true

    - name: Verify Build Output
      run: if ((gci godot3dtiles/addons/cesium_godot/lib -Filter "*.dll").Count -lt 1) { exit 1 }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: godot3dtiles-single-precision-dev
        path: godot3dtiles/
